[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenoscribe"
version = "0.1.0"
description = "Automated HPO phenotype coding from patient interviews"
requires-python = ">=3.10"
# Upper bounds are deliberate. This is a clinical tool: a minor/major release of
# torch/transformers can change the French NER and PII model tokenisation or NER
# output, which changes what reaches the LLM and therefore the codes emitted.
# The caps are pinned to releases that actually exist on PyPI so `uv sync`
# resolves on a clean machine: torch tops out below 2.7 and transformers below
# 4.50. Raise a cap deliberately after re-validating PII/NER output on a known
# transcript, and regenerate uv.lock in the same change.
dependencies = [
    "faster-whisper>=1.0.0,<2",
    "transformers>=4.40.0,<4.50",
    "torch>=2.2,<2.7",
    "chromadb>=0.5.0,<2",
    "openpyxl>=3.1.0,<4",
    "openai>=1.0.0,<3",
    "anthropic>=0.30.0,<1",
    "pyyaml>=6.0,<7",
    "requests>=2.31.0,<3",
    "sentencepiece>=0.2.0,<1",
    "pyannote.audio>=3.1.0,<4",
    "hpo-toolkit>=0.5,<1.0",
    "matplotlib>=3.7,<4",
    "gradio>=5,<6",
    "mlx-whisper>=0.4,<1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
phenoscribe = "phenoscribe.cli:main"
phenoscribe-gui = "phenoscribe.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phenoscribe"]

[tool.pytest.ini_options]
markers = [
    "network: test needs network/model download; skips if the hub is unreachable",
]
