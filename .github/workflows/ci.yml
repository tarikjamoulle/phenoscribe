name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:  # a manual start from the Actions page

jobs:
  test:
    # Each OS gets different wheels of the same locked packages, so test on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        # Installs the version in .python-version.
        run: uv python install

      - name: Install project (locked)
        # Fails when uv.lock does not match pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Cache the HPO and model downloads
        # The obo file, the index model, the HPO release of the validation tests and the IC table.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/chroma
            ~/.hpo-toolkit
            ~/.cache/phenoscribe
          key: downloads-${{ runner.os }}-${{ hashFiles('config.yaml') }}

      - name: First-run setup (no models)
        # Downloads the pinned hp.obo and builds the index, as the start script does.
        run: uv run phenoscribe setup --no-models

      - name: Fetch the HPO release and IC table for the validation tests
        # Without these caches the validation tests count as network tests and are deselected.
        run: uv run python -c "from phenoscribe.validate import load_hpo; from phenoscribe.semantic_similarity import get_ic_map; get_ic_map(load_hpo())"

      - name: Run tests
        # Every test that needs no model download and no paid API key.
        run: uv run python -m pytest -q -m "not network and not live"

      - name: Smoke run (LLM stubbed)
        # One French text through the whole pipeline, with the LLM stubbed.
        run: uv run python scripts/smoke_run.py
