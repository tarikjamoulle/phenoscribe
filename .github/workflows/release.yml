name: Release

# On each version tag (v0.2.0, ...), run the tests, check the version, build
# Phenoscribe.zip and attach it to a GitHub release. See INSTALL.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  zip:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag, pyproject.toml and CITATION.cff agree
        # phenoscribe.__version__ reads pyproject.toml through the package metadata (tests/test_version.py).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          citation=$(sed -n 's/^version: *//p' CITATION.cff)
          echo "tag=$tag pyproject=$project CITATION.cff=$citation"
          [ "$tag" = "$project" ] && [ "$tag" = "$citation" ]

      - name: Build Phenoscribe.zip
        # git archive keeps the executable bit of the .command file and applies .gitattributes (line endings, export-ignore).
        run: git archive --format=zip --prefix=Phenoscribe/ -o Phenoscribe.zip HEAD

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" Phenoscribe.zip
          --title "Phenoscribe $GITHUB_REF_NAME" --generate-notes
