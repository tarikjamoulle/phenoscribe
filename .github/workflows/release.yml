name: Release

# On each version tag (v0.2.0, ...), build Phenoscribe.zip and attach it to a
# GitHub release. Marc downloads the ZIP, extracts it and double-clicks the
# start file for his OS. See INSTALL.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Phenoscribe.zip
        # git archive keeps the executable bit of the .command file (Finder
        # needs it) and applies .gitattributes, so the .bat keeps CRLF.
        run: git archive --format=zip --prefix=Phenoscribe/ -o Phenoscribe.zip HEAD

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" Phenoscribe.zip
          --title "Phenoscribe $GITHUB_REF_NAME" --generate-notes
